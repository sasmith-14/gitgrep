[project]
name = "gitgrep"
version = "0.2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.3",
  "sentence-transformers==4.1.0",
  "httpx==0.28.1",
  "pydantic-settings==2.9.1",
  "markdown-it-py==3.0.0",
]
[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.13"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py311"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
