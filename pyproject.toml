[project]
name = "gitgrep"
version = "0.2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.34.3",
  "sentence-transformers==6.2.0",
  "httpx==0.28.1",
  "pydantic-settings==2.9.1",
  "markdown-it-py==3.0.0",
  "transformers==5.22.1",
  "torch==2.15.0",
]
[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.13"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py311"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
